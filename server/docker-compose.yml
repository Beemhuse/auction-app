services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hammer
      POSTGRES_USER: hammer
      POSTGRES_PASSWORD: hammer
    ports:
      - "5436:5432"
    volumes:
      - hammer_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hammer"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  hammer_postgres:
